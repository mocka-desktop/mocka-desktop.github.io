{% import "partials/macros.html" as ui with context %}
<section class="hero">
  <div class="wrap hero__inner">
    <div class="hero__text">
      <h1 class="hero__headline">{{ HERO.headline }}</h1>
      <p class="hero__subline">{{ HERO.subline }}</p>
      <div class="button-group">
        <a class="button button--primary" href="{{ DOCK_GUIDE_URL }}" rel="noopener">Try Mocka Dock</a>
        <a class="button button--secondary" href="{{ GITHUB_ORG_URL }}" rel="noopener">Follow development</a>
      </div>
    </div>

    <div class="hero__visual">
      {{ ui.laptop(HERO.image, HERO.alt, HERO.width, HERO.height,
                   eager=True, fallback=HERO.fallback) }}
    </div>
  </div>
</section>
